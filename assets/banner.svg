<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="video-skills: a Claude Code skill suite that watches YouTube videos and applies them to your project. Commands: /vask, /vrefine, /vdo, /vqueue, /vcompare, /vsteps.">
  <title>CLAUDE CODE SKILL SUITE: video-skills</title>
  <desc>Hero banner for video-skills with the command names and the YouTube mark.</desc>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#FF0000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="hair-quiet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen-chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF0000" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-lg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FFFFFF"/></pattern>
    <clipPath id="panel"><rect x="8" y="16" width="884" height="256" rx="16"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif}
      .mono{font-family:"SF Mono","JetBrains Mono","Fira Code",Consolas,monospace}
    </style>
  </defs>

  <rect width="900" height="280" fill="#09090B"/>
  <rect width="900" height="280" fill="url(#dots)" opacity="0.04"/>

  <rect x="32.5" y="8.5" width="835" height="231" rx="16" fill="#121215" fill-opacity="0.5" stroke="url(#hair-quiet)" stroke-opacity="0.6"/>

  <rect x="8" y="28" width="884" height="256" rx="16" fill="#000000" fill-opacity="0.35" filter="url(#shadow)"/>
  <g clip-path="url(#panel)">
    <rect x="8" y="16" width="884" height="256" fill="#121215" fill-opacity="0.85"/>
    <ellipse cx="792" cy="144" rx="176" ry="136" fill="url(#glow)" opacity="0.22" filter="url(#blur-lg)"/>
    <rect x="8" y="16" width="884" height="256" fill="url(#sheen)"/>
    <rect x="8" y="16" width="884" height="256" fill="url(#dots)" opacity="0.04"/>
  </g>
  <rect x="32" y="16" width="836" height="1.5" fill="url(#spec)"/>
  <rect x="8.5" y="16.5" width="883" height="255" rx="16" fill="none" stroke="url(#hair)" stroke-width="1"/>

  <circle cx="40" cy="48" r="4" fill="#27272A"/>
  <circle cx="56" cy="48" r="4" fill="#27272A"/>
  <circle cx="72" cy="48" r="4" fill="#27272A"/>

  <text x="48" y="96" class="sans" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#94949B">CLAUDE CODE SKILL SUITE</text>
  <text x="48" y="148" class="sans" font-size="48" font-weight="700" letter-spacing="-0.03em" fill="#F5F5F7">video-skills</text>
  <text x="48" y="180" class="sans" font-size="15" fill="#A1A1AA">Point Claude Code at a YouTube talk. It reads the whole thing,</text>
  <text x="48" y="204" class="sans" font-size="15" fill="#A1A1AA">then applies it to your codebase.</text>

  <g class="mono" font-size="13" text-anchor="middle" fill="#F5F5F7">
    <rect x="48.5" y="224.5" width="63" height="31" rx="6" fill="#18181B" stroke="url(#hair-quiet)"/><rect x="48.5" y="224.5" width="63" height="31" rx="6" fill="url(#sheen-chip)"/><text x="80" y="245">/vask</text>
    <rect x="120.5" y="224.5" width="87" height="31" rx="6" fill="#18181B" stroke="url(#hair-quiet)"/><rect x="120.5" y="224.5" width="87" height="31" rx="6" fill="url(#sheen-chip)"/><text x="164" y="245">/vrefine</text>
    <rect x="216.5" y="224.5" width="55" height="31" rx="6" fill="#18181B" stroke="url(#hair-quiet)"/><rect x="216.5" y="224.5" width="55" height="31" rx="6" fill="url(#sheen-chip)"/><text x="244" y="245">/vdo</text>
    <rect x="280.5" y="224.5" width="79" height="31" rx="6" fill="#18181B" stroke="url(#hair-quiet)"/><rect x="280.5" y="224.5" width="79" height="31" rx="6" fill="url(#sheen-chip)"/><text x="320" y="245">/vqueue</text>
    <rect x="368.5" y="224.5" width="95" height="31" rx="6" fill="#18181B" stroke="url(#hair-quiet)"/><rect x="368.5" y="224.5" width="95" height="31" rx="6" fill="url(#sheen-chip)"/><text x="416" y="245">/vcompare</text>
    <rect x="472.5" y="224.5" width="79" height="31" rx="6" fill="#18181B" stroke="url(#hair-quiet)"/><rect x="472.5" y="224.5" width="79" height="31" rx="6" fill="url(#sheen-chip)"/><text x="512" y="245">/vsteps</text>
  </g>
  <g>
    <rect x="720.5" y="72.5" width="143" height="143" rx="40" fill="#18181B" stroke="url(#hair)" stroke-width="1"/>
    <rect x="721" y="73" width="142" height="142" rx="39.5" fill="url(#sheen)"/>
    <rect x="748" y="73" width="88" height="1.5" fill="url(#spec)"/>
    <g transform="translate(739.2 91.2) scale(4.4)"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/><polygon fill="#FFFFFF" points="9.545,8.432 15.818,12 9.545,15.568"/></g>
  </g>
</svg>
